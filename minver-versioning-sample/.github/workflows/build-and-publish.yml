name: Build, test, and publish

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore tests/minver-versioning-sample.Tests/minver-versioning-sample.Tests.csproj
      - name: Build and test
        run: dotnet test tests/minver-versioning-sample.Tests/minver-versioning-sample.Tests.csproj --configuration Release --no-restore

  # MinVer height follows the first parent of each merge, so squash merging and
  # merge commits both advance the preview by exactly one pull request. That is
  # why this job has no merge-commit guard. Disable "Allow rebase merging" in
  # the repository pull-request settings instead: a rebased pull request replays
  # every branch commit onto main and multiplies the height.
  calculate-version:
    name: Calculate MinVer version
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: build-test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      assembly_version: ${{ steps.version.outputs.assembly_version }}
      informational_version: ${{ steps.version.outputs.informational_version }}
      environment: ${{ steps.version.outputs.environment }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet tool install --tool-path "$RUNNER_TEMP/minver" minver-cli --version 8.0.0
      # minver-cli has no configuration file, so scripts/calculate-version.sh owns the
      # options. Every caller runs that script, which keeps the strategy in one place.
      - name: Calculate version
        id: version
        shell: bash
        env:
          MINVER_CLI: ${{ runner.temp }}/minver/minver
        run: |
          bash scripts/calculate-version.sh github-output | tee -a "$GITHUB_OUTPUT"

  publish:
    name: Publish application and release notes
    needs: [build-test, calculate-version]
    if: (!startsWith(github.ref, 'refs/tags/v') && contains(needs.calculate-version.outputs.version, '-')) || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore src/minver-versioning-sample.csproj
      - name: Publish
        run: dotnet publish src/minver-versioning-sample.csproj --configuration Release --no-restore --output publish -p:Version=${{ needs.calculate-version.outputs.version }}
      - name: Create release asset
        run: zip -r "minver-${{ needs.calculate-version.outputs.version }}.zip" publish
      - name: Publish matching Release Drafter draft
        uses: release-drafter/release-drafter@v7
        with:
          config-name: release-drafter.yml
          version: ${{ needs.calculate-version.outputs.version }}
          name: v${{ needs.calculate-version.outputs.version }}
          tag: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', needs.calculate-version.outputs.version) }}
          publish: ${{ startsWith(github.ref, 'refs/tags/v') && !contains(needs.calculate-version.outputs.version, '-preview.') }}
          prerelease: ${{ contains(needs.calculate-version.outputs.version, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', needs.calculate-version.outputs.version) }}" "minver-${{ needs.calculate-version.outputs.version }}.zip" --clobber

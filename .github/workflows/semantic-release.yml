name: semantic-release sample

on:
  pull_request:
    paths:
      - "semantic-release-versioning-sample/**"
      - ".github/workflows/semantic-release.yml"
  push:
    branches: [main]
    paths:
      - "semantic-release-versioning-sample/**"
      - ".github/workflows/semantic-release.yml"
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build-test:
    name: semantic-release build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: semantic-release-versioning-sample
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: semantic-release-versioning-sample/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: npm ci
      - run: dotnet restore tests/semantic-release-versioning-sample.Tests/semantic-release-versioning-sample.Tests.csproj
      - run: dotnet test tests/semantic-release-versioning-sample.Tests/semantic-release-versioning-sample.Tests.csproj --configuration Release --no-restore

  calculate-version:
    name: Calculate semantic-release version
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: semantic-release-versioning-sample
    outputs:
      version: ${{ steps.version.outputs.version }}
      assembly_version: ${{ steps.version.outputs.assembly_version }}
      informational_version: ${{ steps.version.outputs.informational_version }}
      environment: ${{ steps.version.outputs.environment }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: semantic-release-versioning-sample/package-lock.json
      - run: npm ci
      - name: Calculate version
        id: version
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/calculate-version.sh github-output | tee -a "$GITHUB_OUTPUT"

  publish:
    name: semantic-release publish
    needs: [build-test, calculate-version]
    if: (contains(needs.calculate-version.outputs.version, '-preview.') && !startsWith(github.ref, 'refs/tags/v')) || (startsWith(github.ref, 'refs/tags/v') && !contains(needs.calculate-version.outputs.version, '-preview.'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: semantic-release-versioning-sample
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: semantic-release-versioning-sample/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore src/semantic-release-versioning-sample.csproj
      - run: dotnet publish src/semantic-release-versioning-sample.csproj --configuration Release --no-restore --output publish -p:Version=${{ needs.calculate-version.outputs.version }}
      - run: zip -r "semantic-release-${{ needs.calculate-version.outputs.version }}.zip" publish
      - name: Publish semantic-release release
        uses: release-drafter/release-drafter@v7
        with:
          config-name: release-drafter.yml
          version: ${{ needs.calculate-version.outputs.version }}
          name: v${{ needs.calculate-version.outputs.version }}
          tag: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', needs.calculate-version.outputs.version) }}
          publish: ${{ startsWith(github.ref, 'refs/tags/v') && !contains(needs.calculate-version.outputs.version, '-preview.') }}
          prerelease: ${{ contains(needs.calculate-version.outputs.version, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload semantic-release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', needs.calculate-version.outputs.version) }}" "semantic-release-${{ needs.calculate-version.outputs.version }}.zip" --clobber

name: Auto Labeler

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

jobs:
  auto-labeler:
    name: Auto Labeler
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Apply Release Drafter labels
        uses: release-drafter/release-drafter/autolabeler@v7
        with:
          config-name: release-drafter.yml

name: Arcade sample

on:
  pull_request:
    paths:
      - "arcade-versioning-sample/**"
      - ".github/workflows/arcade.yml"
  push:
    branches: [main]
    paths:
      - "arcade-versioning-sample/**"
      - ".github/workflows/arcade.yml"
    tags: ["v*"]

permissions:
  contents: read

env:
  ARCADE_FEED: https://pkgs.dev.azure.com/dnceng/public/_packaging/dotnet-eng/nuget/v3/index.json

jobs:
  build-test:
    name: Arcade build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: arcade-versioning-sample
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet nuget add source "$ARCADE_FEED" --name dotnet-eng
      - run: dotnet restore tests/arcade-versioning-sample.Tests/arcade-versioning-sample.Tests.csproj
      - run: dotnet test tests/arcade-versioning-sample.Tests/arcade-versioning-sample.Tests.csproj --configuration Release --no-restore

  calculate-version:
    name: Calculate Arcade version
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: build-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: arcade-versioning-sample
    outputs:
      version: ${{ steps.version.outputs.version }}
      assembly_version: ${{ steps.version.outputs.assembly_version }}
      informational_version: ${{ steps.version.outputs.informational_version }}
      environment: ${{ steps.version.outputs.environment }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Calculate version
        id: version
        shell: bash
        run: |
          ./scripts/calculate-version.sh github-output | tee -a "$GITHUB_OUTPUT"

  publish:
    name: Arcade publish
    needs: [build-test, calculate-version]
    if: (contains(needs.calculate-version.outputs.version, '-preview.') && !startsWith(github.ref, 'refs/tags/v')) || (startsWith(github.ref, 'refs/tags/v') && !contains(needs.calculate-version.outputs.version, '-preview.'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: arcade-versioning-sample
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet nuget add source "$ARCADE_FEED" --name dotnet-eng
      - run: dotnet restore src/arcade-versioning-sample.csproj
      - run: dotnet publish src/arcade-versioning-sample.csproj --configuration Release --no-restore --output publish -p:Version=${{ needs.calculate-version.outputs.version }} -p:OfficialBuild=${{ startsWith(github.ref, 'refs/tags/v') }}
      - run: zip -r "arcade-${{ needs.calculate-version.outputs.version }}.zip" publish
      - name: Publish Arcade release
        uses: release-drafter/release-drafter@v7
        with:
          config-name: release-drafter.yml
          version: ${{ needs.calculate-version.outputs.version }}
          name: v${{ needs.calculate-version.outputs.version }}
          tag: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', needs.calculate-version.outputs.version) }}
          publish: ${{ startsWith(github.ref, 'refs/tags/v') && !contains(needs.calculate-version.outputs.version, '-preview.') }}
          prerelease: ${{ contains(needs.calculate-version.outputs.version, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload Arcade asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', needs.calculate-version.outputs.version) }}" "arcade-${{ needs.calculate-version.outputs.version }}.zip" --clobber

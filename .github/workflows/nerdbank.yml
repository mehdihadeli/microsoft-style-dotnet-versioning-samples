name: Nerdbank.GitVersioning sample

on:
  pull_request:
    paths:
      - "nerdbank-versioning-sample/**"
      - ".github/workflows/nerdbank.yml"
  push:
    branches: [main]
    paths:
      - "nerdbank-versioning-sample/**"
      - ".github/workflows/nerdbank.yml"
    tags: ["v*"]

permissions:
  contents: read

env:
  DOTNET_VERSION: 10.0.x

jobs:
  build-test:
    name: NBGV build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nerdbank-versioning-sample
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet restore tests/nerdbank-versioning-sample.Tests/nerdbank-versioning-sample.Tests.csproj
      - run: dotnet test tests/nerdbank-versioning-sample.Tests/nerdbank-versioning-sample.Tests.csproj --configuration Release --no-restore

  calculate-version:
    name: Calculate NBGV version
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: build-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nerdbank-versioning-sample
    outputs:
      version: ${{ steps.version.outputs.version }}
      assembly_version: ${{ steps.version.outputs.assembly_version }}
      informational_version: ${{ steps.version.outputs.informational_version }}
      environment: ${{ steps.version.outputs.environment }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Calculate version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          nbgv="$RUNNER_TEMP/nbgv/nbgv"
          dotnet tool install --tool-path "$RUNNER_TEMP/nbgv" nbgv --version 3.10.94
          bash scripts/calculate-version.sh . "$nbgv" github-output | tee -a "$GITHUB_OUTPUT"

  publish:
    name: Publish NBGV release
    needs: [build-test, calculate-version]
    if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && contains(needs.calculate-version.outputs.version, '-preview.') && !contains(needs.calculate-version.outputs.version, '-preview.0'))
    runs-on: ubuntu-latest
    environment: ${{ needs.calculate-version.outputs.environment }}
    permissions:
      contents: write
    defaults:
      run:
        working-directory: nerdbank-versioning-sample
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet restore src/nerdbank-versioning-sample.csproj
      - run: dotnet publish src/nerdbank-versioning-sample.csproj --configuration Release --no-restore --output publish -p:Version=${{ needs.calculate-version.outputs.version }} -p:InformationalVersion=${{ needs.calculate-version.outputs.informational_version }}
      - run: zip -r "nerdbank-${{ needs.calculate-version.outputs.version }}.zip" publish
      - name: Update or publish Release Drafter release
        if: always()
        uses: release-drafter/release-drafter@v7
        with:
          config-name: release-drafter.yml
          version: ${{ needs.calculate-version.outputs.version }}
          name: v${{ needs.calculate-version.outputs.version }}
          tag: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', needs.calculate-version.outputs.version) }}
          publish: ${{ startsWith(github.ref, 'refs/tags/v') && !contains(needs.calculate-version.outputs.version, '-preview.') }}
          prerelease: ${{ contains(needs.calculate-version.outputs.version, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload NBGV asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', needs.calculate-version.outputs.version) }}" "nerdbank-${{ needs.calculate-version.outputs.version }}.zip" --clobber
